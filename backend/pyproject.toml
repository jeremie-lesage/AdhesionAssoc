[project]
name = "foyer-rural-backend"
version = "0.1.0"
description = "Backend API pour le formulaire d'inscription du Foyer Rural de Fauverney"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]>=0.116.1",
    "uvicorn>=0.35.0",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",
    "pydantic[email]>=2.11.7",
    "pydantic-settings>=2.0.0",
    "psycopg2-binary",
    "sqlalchemy",
    "sib-api-v3-sdk",
    "alembic>=1.18.4",
    # Importé directement par email_service.py (rendu des emails avec échappement).
    # Déjà tiré par fastapi[all] pour les templates, mais déclaré ici pour ne pas
    # dépendre d'un extra : sans lui, l'import échoue au démarrage.
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
# Les tests importent les modules à plat (`from models import ...`) : pythonpath
# remplace les `sys.path.insert` manuels dans les fichiers de tests.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "alembic/*", ".venv/*"]

[tool.ruff]
line-length = 100
# Les migrations générées par Alembic ne sont pas du code à maintenir à la main.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Sélection explicite : les règles par défaut de ruff varient d'une version à
# l'autre, on fixe le périmètre pour que `mise run lint` soit reproductible.
# E4/E7/E9 seulement (comme forge-communes) : le style de mise en forme reste
# du ressort de `mise run format`, pas du lint bloquant.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4"]
ignore = [
    # `Depends()` / `Query()` en valeur par défaut est l'idiome FastAPI.
    "B008",
]
