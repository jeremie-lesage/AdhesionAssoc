[project]
name = "foyer-rural-backend"
version = "0.1.0"
description = "Backend API pour le formulaire d'inscription du Foyer Rural de Fauverney"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]>=0.116.1",
    "uvicorn>=0.35.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.1",
    "pydantic[email]>=2.11.7",
    "pydantic-settings>=2.0.0",
    "psycopg2-binary",
    "sqlalchemy",
    "sib-api-v3-sdk",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
]
