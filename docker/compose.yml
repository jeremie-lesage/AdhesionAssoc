services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: foyer-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db
    networks:
      - foyer-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: foyer-frontend
    restart: unless-stopped
    networks:
      - foyer-net

  caddy:
    image: caddy:2.7.6-alpine
    container_name: foyer-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - frontend
      - backend
    networks:
      - foyer-net

  db:
    image: postgres:16-alpine
    container_name: foyer-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - foyer-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: foyer-pgadmin
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - foyer-net

  db_backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: foyer-db-backup
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db_backup_data:/backups
    depends_on:
      - db
    networks:
      - foyer-net

volumes:
  db_data:
  caddy_data:
  db_backup_data:

networks:
  foyer-net:
    driver: bridge