services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: foyer-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Sans cela, uvicorn ne fait confiance qu'à 127.0.0.1 et ignore le
      # `X-Forwarded-For` posé par Caddy : `request.client.host` vaut alors l'IP
      # du conteneur proxy, et le compteur de `rate_limiter` devient commun à
      # tous les visiteurs — un seul curieux fermerait le formulaire à toute la
      # commune. La plage couvre l'adressage des bridges Docker (Caddy y est,
      # quel que soit le sous-réseau attribué) ; aucune IP publique n'en fait
      # partie, donc uvicorn retient bien celle du visiteur.
      # Ne PAS mettre `*` : uvicorn prendrait alors l'entrée la plus à gauche de
      # `X-Forwarded-For`, que le client écrit lui-même, et la limite se
      # contournerait avec un en-tête variable (cf. tests
      # TestRateLimitingBehindTheProxy).
      FORWARDED_ALLOW_IPS: 172.16.0.0/12
    depends_on:
      - db
    networks:
      - foyer-net

  frontend_builder:
    image: node:20-alpine
    container_name: foyer-frontend-builder
    working_dir: /app
    command: sh -c "npm install && rm -rf dist && npm run build"
    restart: no
    environment:
      VITE_BACKEND_URL: https://inscription.foyerruralfauverney.fr
    volumes:
      - ../frontend:/app

  caddy:
    image: caddy:2.7.6-alpine
    container_name: foyer-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - ../frontend/dist:/usr/share/caddy/html:ro
    depends_on:
      - frontend_builder
      - backend
    networks:
      - foyer-net
  

  db:
    image: postgres:17-alpine
    container_name: foyer-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - foyer-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: foyer-pgadmin
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - foyer-net

  db_backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: foyer-db-backup
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db_backup_data:/backups
    depends_on:
      - db
    networks:
      - foyer-net

volumes:
  db_data:
  caddy_data:
  db_backup_data:

networks:
  foyer-net:
    driver: bridge
