services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: foyer-backend
    restart: unless-stopped
    networks:
      - foyer-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: foyer-frontend
    restart: unless-stopped
    networks:
      - foyer-net

  proxy:
    image: nginx:stable-alpine
    container_name: foyer-proxy
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - foyer-net

networks:
  foyer-net:
    driver: bridge
